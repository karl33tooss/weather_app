name: weather_app
description: "A professional weather app using Clean Architecture"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # --- Керування станом (State Management) ---
  # bloc: Чиста бізнес-логіка. Дозволяє керувати потоками даних.
  bloc: ^9.0.0
  # flutter_bloc: Зв'язує Bloc з віджетами Flutter (надає BlocProvider, BlocBuilder).
  flutter_bloc: ^9.1.1

  # --- Архітектура та Навігація ---
  # get_it: Сервіс-локатор (Dependency Injection). Дозволяє отримувати доступ до 
  # сервісів (наприклад, API) з будь-якої частини програми без передачі через конструктори.
  get_it: ^8.0.3
  # go_router: Декларативна навігація. Дозволяє керувати екранами через URL-шляхи,
  # обробляти глибокі посилання (deep links) та редіректи.
  go_router: ^16.0.0

  # --- Робота з мережею (Networking) ---
  # dio: Потужний HTTP-клієнт. Підтримує інтерцептори (перехоплювачі), 
  # глобальну обробку помилок та скасування запитів. Кращий за стандартний http.
  dio: ^5.8.0+1

  # --- UI та Дизайн ---
  # smooth_page_indicator: Віджет для відображення індикатора сторінок (крапки),
  # який ми використаємо у каруселі прогнозу погоди.
  smooth_page_indicator: ^1.2.1
  # cupertino_icons: Набір іконок у стилі iOS.
  cupertino_icons: ^1.0.6
  # google_fonts: Дозволяє легко підключати кастомні шрифти (наприклад, для унікального дизайну).
  google_fonts: ^6.1.0

  # --- Підтримка генерації коду ---
  # Анотації, які ми будемо писати над класами (наприклад, @freezed), 
  # щоб генератор знав, що з ними робити.
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Лінтер: слідкує за чистотою коду і підсвічує погані практики.
  flutter_lints: ^5.0.0

  # --- Генератори коду (Code Generators) ---
  # build_runner: "Двигун", який запускає всі генератори. Без нього freezed не запрацює.
  # Команда запуску: dart run build_runner build
  build_runner: ^2.4.13
  
  # freezed: Генератор незмінних (immutable) класів даних. 
  # Автоматично створює методи copyWith, toString, equals та оператори порівняння.
  freezed: ^3.1.0
  
  # json_serializable: Генератор, який створює код для перетворення JSON у твої об'єкти і навпаки.
  json_serializable: ^6.9.0