name: weather_app
description: "A professional weather app using Clean Architecture"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # --- Керування станом (State Management) ---
  bloc: ^9.0.0
  flutter_bloc: ^9.1.1

  # --- Архітектура та Навігація ---
  get_it: ^8.0.3
  go_router: ^14.0.0

  # --- Робота з мережею (Networking) ---
  dio: ^5.8.0+1

  # --- UI та Дизайн ---
  smooth_page_indicator: ^1.2.1
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0

  # --- Підтримка генерації коду ---
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # --- Генератори коду (Code Generators) ---
  build_runner: ^2.4.13
  freezed: ^3.1.0
  json_serializable: ^6.9.0

# --- ОСЬ ТУТ МАЄ БУТИ ЦЕЙ БЛОК (В САМОМУ НИЗУ) ---
flutter:
  uses-material-design: true
  
  assets:
    - assets/icons/